<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Zeitgeisty Query Results</title>
    <link href="{{ url_for('static', filename='tacit-css-1.5.5.min.css') }}" rel="stylesheet" type="text/css" />
  </head>
  <body>
    <h1>Aphorisms for &ldquo;{{ query }}&rdquo;</h1>
    {% if error %}
    <p>{{ error }}</p>
    {% elif aphorisms %}
    <ol>
      {% for aphorism in aphorisms %}
      <li>{{ aphorism }}</li>
      {% endfor %}
    </ol>
    {% else %}
    <p>No aphorisms could be generated. Try different text.</p>
    {% endif %}
    <p><a href="/">More Zeitgeisty Aphorisms</a></p>
    <h2>Try another query</h2>
    <form action="/query" method="post">
      <input type="text" name="query" placeholder="Enter a line of text" size="60" />
      <button type="submit">Generate</button>
    </form>
  </body>
</html>
